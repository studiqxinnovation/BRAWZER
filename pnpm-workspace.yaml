packages:
  - apps/*
  - packages/*

# Refuse to install on an unsupported Node.js version.
engineStrict: true

# Supply-chain protection: only install releases that have been public for at
# least 7 days (10080 minutes). Malicious or broken releases are usually caught
# and pulled within that window. Do not add exemptions without a security reason.
minimumReleaseAge: 10080

# One exact version per dependency for the whole workspace.
# Packages reference these with "catalog:" so upgrades happen in one place.
catalog:
  "@aws-sdk/client-s3": 3.1161.0
  "@aws-sdk/lib-storage": 3.1161.0
  "@axe-core/playwright": 4.14.0
  "@base-ui/react": 1.9.0
  "@eslint/js": 9.39.5
  "@fastify/cookie": 11.1.5
  "@fastify/helmet": 13.2.0
  "@fastify/multipart": 10.1.6
  "@fastify/static": 10.1.8
  "@fastify/websocket": 11.3.4
  "@nestjs/cli": 12.0.11
  "@nestjs/common": 12.3.2
  "@nestjs/core": 12.3.2
  "@nestjs/platform-fastify": 12.3.2
  "@nestjs/swagger": 12.0.5
  "@nestjs/testing": 12.3.2
  "@node-rs/argon2": 2.2.2
  "@playwright/test": 1.64.1
  "@simplewebauthn/browser": 14.0.0
  "@simplewebauthn/server": 14.0.3
  "@tailwindcss/turbopack": 4.3.3
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  "@types/qrcode": 1.5.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/ws": 8.18.2
  "@vitejs/plugin-react": 6.1.2
  axe-core: 4.14.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 9.39.5
  eslint-config-next: 16.4.3
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-react-hooks: 7.1.1
  fastify: 5.12.7
  file-type: 22.3.0
  globals: 17.13.0
  ioredis: 6.0.0
  jsdom: 30.1.3
  lucide-react: 1.65.0
  motion: 14.9.0
  next: 16.4.3
  otplib: 13.5.0
  pg: 8.23.1
  pino: 10.4.0
  pino-pretty: 13.2.0
  prettier: 3.9.10
  prettier-plugin-tailwindcss: 0.8.1
  qrcode: 1.5.4
  react: 19.3.1
  react-dom: 19.3.1
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  socks: 2.8.10
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  turbo: 2.11.10
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.5
  vitest: 5.0.5
  ws: 8.22.0
  zod: 4.6.7

# Dependency install scripts are blocked unless explicitly allowed here.
allowBuilds:
  # Telemetry ping bundled with swagger-ui-dist. Never needed.
  "@scarf/scarf": false
  # Verifies its platform binary; safe and widely used (drizzle-kit, vite tooling).
  esbuild: true
  # Prebuilt binaries arrive via optional dependencies; no script needed.
  sharp: false
  unrs-resolver: false
