name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint, formatting, type checks and unit tests
        run: pnpm check
      - name: Production build
        run: pnpm build

  integration:
    name: API integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Development values only (see the file); the same services as locally.
      - run: cp .env.example .env
      - name: Start PostgreSQL, Valkey, Mailpit and OpenBao
        run: pnpm infra:up
      - run: pnpm db:migrate
      - run: pnpm test:integration

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - name: Start PostgreSQL, Valkey, Mailpit and OpenBao
        run: pnpm infra:up
      - run: pnpm db:migrate
      - name: Install Chromium for Playwright
        run: pnpm --filter @brawzer/web exec playwright install --with-deps chromium
      - name: Browser tests (desktop and phone)
        run: pnpm test:e2e
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  images:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t brawzer-api:ci .
      - name: Build the web image
        run: >-
          docker build -f apps/web/Dockerfile -t brawzer-web:ci
          --build-arg NEXT_PUBLIC_SITE_URL=https://brawzer.example
          --build-arg API_INTERNAL_URL=http://api:4100 .
      - name: Both images run as a non-root user
        run: |
          test "$(docker image inspect brawzer-api:ci --format '{{.Config.User}}')" = node
          test "$(docker image inspect brawzer-web:ci --format '{{.Config.User}}')" = node

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Fails on high or critical advisories. Moderate ones are reviewed by
      # hand (docs/SECURITY.md lists the accepted ones).
      - run: pnpm audit --audit-level=high
