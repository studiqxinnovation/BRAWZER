name: Set up Brawzer
description: Node (from .nvmrc), pnpm at the pinned version, the pnpm store cache, and a frozen install.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc

    # Installed from npm at the exact version in package.json, rather than
    # through a third-party action.
    - name: Install pnpm
      shell: bash
      run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    # --frozen-lockfile: CI installs exactly what the lockfile says, and pnpm
    # re-checks it against the 7-day release-age policy.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
