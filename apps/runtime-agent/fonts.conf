<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Brawzer's cloud browsers: the fonts pages ask for on a Mac or Windows,
  mapped to the nearest free ones the image ships, and text rendered the way
  a Mac renders it. Metric-compatible where a free twin exists (Carlito for
  Calibri, Caladea for Cambria, Liberation for Arial, Times and Courier).
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- The system font: what -apple-system, system-ui and Segoe UI mean here. -->
  <alias binding="same"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>San Francisco</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>

  <!-- Common web and office fonts. -->
  <alias binding="same"><family>Roboto</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>Open Sans</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>Open Sans</family></prefer></alias>
  <alias binding="same"><family>Trebuchet MS</family><prefer><family>Lato</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>Liberation Mono</family></prefer></alias>

  <alias><family>sans-serif</family><prefer><family>Inter</family><family>Liberation Sans</family><family>Noto Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family><family>Noto Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family><family>Noto Sans Mono</family></prefer></alias>
</fontconfig>
