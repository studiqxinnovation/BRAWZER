# The managed services, self-hosted on the app host for an installation
# without a provider's managed PostgreSQL, Valkey, key service or scanner
# (infra/hostman/README.md says why). Each binds to the compose network only;
# nothing here is published on the host's addresses. Data lives in named
# volumes under /var/lib/docker/volumes; back them up with the runbook.
#
#   docker compose -f infra/production/services.yaml --env-file infra/production/services.env up -d --wait
name: brawzer-services

x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *common
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_USER: brawzer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: brawzer
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      [
        "postgres",
        "-c",
        "max_connections=200",
        "-c",
        "shared_buffers=256MB",
        "-c",
        "log_min_duration_statement=2000",
      ]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brawzer -d brawzer"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  valkey:
    <<: *common
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command:
      [
        "valkey-server",
        "--requirepass",
        "${VALKEY_PASSWORD:?set VALKEY_PASSWORD}",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "noeviction",
        "--save",
        "60",
        "1000",
        "--appendonly",
        "yes",
      ]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  # The key service: OpenBao in server mode with file storage, sealed with a
  # key kept in /etc/brawzer/openbao on the host, unsealed by the sidecar.
  openbao:
    <<: *common
    image: openbao/openbao:2.6.5@sha256:09f1eaaee351c329d75a5a89654d6e1ad4792998650c3cbf0c3513a76d9d9b6e
    command: ["server", "-config=/openbao/config/server.hcl"]
    volumes:
      - ./openbao.hcl:/openbao/config/server.hcl:ro
      - openbao-data:/openbao/file
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200 >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  # Unseals OpenBao after every start from the host's root-only key file, and
  # on first start initialises it and writes that file (see openbao-init.sh).
  openbao-unseal:
    <<: *common
    image: openbao/openbao:2.6.5@sha256:09f1eaaee351c329d75a5a89654d6e1ad4792998650c3cbf0c3513a76d9d9b6e
    entrypoint: ["/bin/sh", "/scripts/openbao-init.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./openbao-init.sh:/scripts/openbao-init.sh:ro
      - /etc/brawzer/openbao:/keys
    depends_on:
      openbao: { condition: service_healthy }
    networks: [app]

  clamav:
    <<: *common
    image: clamav/clamav-debian:1.5.4@sha256:c21aa18cc0a358678255a3dfb343a4555b58f71b97d7b869df8fdf7ea0a5b4b1
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMD_CONF_StreamMaxLength: 120M
      CLAMD_CONF_MaxFileSize: 120M
      CLAMD_CONF_MaxScanSize: 120M
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks: [app]

volumes:
  postgres-data:
  valkey-data:
  openbao-data:
  clamav-db:

networks:
  app:
    name: brawzer_app
    external: true
