# Local development services for Brawzer. Not a production deployment.
#
#   pnpm infra:up      start everything and wait until healthy
#   pnpm infra:down    stop (data is kept)
#   pnpm infra:reset   stop and delete all local data
#
# Ports bind to 127.0.0.1 only, so nothing is reachable from your network.
name: brawzer

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brawzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brawzer_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-brawzer}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: valkey/valkey:9.1.3-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1125}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8125}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Vault-compatible key service (OpenBao) in dev mode: in-memory, fixed
  # local-only token. Used to test the production key provider.
  openbao:
    image: openbao/openbao:2.6.5
    restart: unless-stopped
    command:
      - server
      - -dev
      - -dev-root-token-id=${VAULT_TOKEN:-brawzer_local_only}
      - -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8210}:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 3s
      timeout: 3s
      retries: 30

  # S3-compatible object store for Brawzer Drive (production uses a managed
  # store). Credentials are development values only.
  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY_ID:-brawzer_local_only}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_ACCESS_KEY:-brawzer_local_only}
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9100}:9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      # Any HTTP answer means the S3 API is listening.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:9000/"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Malware scanner for Drive uploads. Bundled signatures only, no network;
  # production keeps signatures updated.
  clamav:
    image: clamav/clamav-debian:1.5.4@sha256:c21aa18cc0a358678255a3dfb343a4555b58f71b97d7b869df8fdf7ea0a5b4b1
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
      # Drive accepts files up to 100 MiB; clamd's default stream limit is 25M.
      CLAMD_CONF_StreamMaxLength: 105M
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 40

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
